
server {
    server_name ainize.ai www.ainize.ai;

    access_log /var/log/nginx/ainize.access.log;
    error_log  /var/log/nginx/ainize.error.log;

    client_max_body_size 100m;

    location = /api/auth/enroll { return 403; }

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ainize.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ainize.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ainize.ai) { return 301 https://$host$request_uri; } # managed by Certbot
    if ($host = ainize.ai)     { return 301 https://$host$request_uri; } # managed by Certbot
    server_name ainize.ai www.ainize.ai;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
