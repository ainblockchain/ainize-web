# ainize.ai — nginx serves the site, a node answers the API.
#
#   sudo cp deploy/nginx/ainize.ai.conf /etc/nginx/sites-available/ainize.ai
#   sudo ln -s /etc/nginx/sites-available/ainize.ai /etc/nginx/sites-enabled/ainize.ai
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ainize.ai -d www.ainize.ai       # rewrites this file with the TLS block
#
# WHY NGINX SERVES THE FILES AND NOT THE NODE. A node CAN serve the site — that is how a single `ainize start`
# gives an operator a working UI on localhost, and it is the right default for that. It is the wrong thing for
# a public site: the site then lives or dies with the node process, a node restart is a site outage, the
# static files travel through an express route for no reason, and the deployed build becomes whatever
# directory happened to sit beside the installed CLI (which is exactly how this site came to serve a build
# nobody could identify). nginx already terminates TLS here, so it is already in the path; letting it do what
# it is for costs nothing and removes the coupling.
#
# WHAT MAKES THIS SAFE. The web app is a static build with no build-time configuration and it calls exactly
# one prefix — `/api` (checked: `baseUrl: '/'` in src/api/api.ts, and no other prefix appears in
# its API layer). Nothing is injected into index.html by the node. So "same origin" is a property of the
# ORIGIN, not of the process, and one vhost satisfies it.

server {
    server_name ainize.ai www.ainize.ai;

    access_log /var/log/nginx/ainize.access.log;
    error_log  /var/log/nginx/ainize.error.log;

    # The deploy script flips this symlink atomically, so a release swap is never half-served.
    root /home/comcom/ainize-web-releases/current;
    index index.html;

    client_max_body_size 100m;

    # Hashed assets are immutable by construction — the name changes when the content does.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached, or a browser keeps asking for assets a release ago.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API, and only the API, goes to the node.
    location /api/ {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ChatMode's live test is a long streamed request: the node holds the shared runtime lock, answers
        # twice (base and patched) and can wait minutes on a queue. Buffering collapses that into one late
        # burst and the default 60s read timeout cuts it off entirely.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    # x402 settlement and p2p blob transfer are node routes too. They are not used by the browser, but a peer
    # reaching this host by name must not be answered with the SPA.
    location /x402/ { proxy_pass http://127.0.0.1:3400; proxy_set_header Host $host; proxy_read_timeout 600s; }
    location /p2p/  { proxy_pass http://127.0.0.1:3400; proxy_set_header Host $host; proxy_read_timeout 600s; }

    # Everything else is the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
    listen [::]:80;
}
