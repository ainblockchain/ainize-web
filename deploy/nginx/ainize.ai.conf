# ainize.ai — nginx terminates TLS and proxies the domain to the app.
#
#   sudo cp deploy/nginx/ainize.ai.conf /etc/nginx/sites-available/ainize.ai
#   sudo ln -s /etc/nginx/sites-available/ainize.ai /etc/nginx/sites-enabled/ainize.ai
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ainize.ai -d www.ainize.ai       # rewrites this file with the TLS block
#
# WHY NGINX NO LONGER SERVES FILES. It used to: the site was a static build, and nginx served it from a release
# directory and forwarded /api to the node. That is the right shape for a static site and the wrong one for this
# app, because the app is not static any more — it is a Next.js server, and its route handlers ARE the backend:
#
#     browser  ->  this app  ->  main node  ->  the node that runs the agent
#
# Only the first hop is public. The node's address lives in the app's environment (AINIZE_NODE_URL) and never
# reaches a browser, which is what lets an agent on a machine with no public address still be reachable by name
# at https://ainize.ai/agents/<id>. A web server cannot make that decision; it has no idea which node to ask.
#
# So there is exactly one location here. Everything — pages, /api, /agents, /x402, /p2p, the static assets Next
# fingerprints under /_next — goes to one process, and what each path means is decided in the code.

upstream ainize_web {
    server 127.0.0.1:3900;
    keepalive 32;
}

server {
    server_name ainize.ai www.ainize.ai;

    access_log /var/log/nginx/ainize.access.log;
    error_log  /var/log/nginx/ainize.error.log;

    client_max_body_size 100m;

    # Enrolling an operator is loopback-only at the node, and behind a proxy every request looks loopback: the
    # node reads the TCP peer, which is nginx. Until it judges that from the forwarded chain instead, the route
    # is refused here. Nothing legitimate goes through the proxy — enrolment happens on the machine itself.
    location = /api/auth/enroll { return 403; }

    # Immutable by construction: the filename changes when the content does.
    location /_next/static/ {
        proxy_pass http://ainize_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://ainize_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # A live test is a long streamed request: the node holds the runtime lock, answers twice (base and
        # patched) and can wait minutes on a queue. Buffering collapses that into one late burst, and the
        # default 60s read timeout cuts it off entirely. An agent call is the same shape, one hop further out.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    listen 80;
    listen [::]:80;
}

# `Connection: upgrade` only when the client asked for it; a bare "upgrade" breaks keepalive for everything else.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
