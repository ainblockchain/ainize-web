# ainize.ai — nginx terminates TLS and forwards the domain to the app.
#
#   sudo cp deploy/nginx/ainize.ai.conf /etc/nginx/sites-available/ainize.ai
#   sudo ln -s /etc/nginx/sites-available/ainize.ai /etc/nginx/sites-enabled/ainize.ai
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ainize.ai -d www.ainize.ai       # adds the TLS lines
#
# WHAT CHANGED, AND WHY IT IS SMALL. nginx used to serve a static build from a release directory and forward
# /api, /x402 and /p2p to the node. The site is a Next.js app now — the pages AND the backend — so all of that
# collapses into one `proxy_pass`. The three node blocks are GONE on purpose, not by omission: leaving them
# would send /api straight past the app to the node, and the app's route handlers are the only thing keeping
# the node's address off the public network.
#
#     browser  ->  this app (:3900)  ->  main node  ->  the node that runs the agent
#
# Only the first hop is public. That is also why `https://ainize.ai/agents/<id>` works for an agent on a machine
# with no public address, and why no path here needs a rule of its own: what a path means is decided in code.

server {
    server_name ainize.ai www.ainize.ai;

    access_log /var/log/nginx/ainize.access.log;
    error_log  /var/log/nginx/ainize.error.log;

    client_max_body_size 100m;

    # Enrolling an operator is loopback-only at the node, and behind this proxy EVERY request looks loopback:
    # the node reads the TCP peer, which is nginx. Until the node judges that from the forwarded chain instead,
    # the route is refused here. Nothing legitimate goes through the proxy — enrolment happens on the machine the
    # node runs on, where there is no proxy in the path.
    location = /api/auth/enroll { return 403; }

    # Everything: the pages AND the backend. The app is a Next.js server, not a directory of files — its
    # route handlers are what keep the node's address off the public network — so there is one location and
    # what each path means is decided in the code.
    #
    # proxy_buffering off: a live test holds the node's runtime lock and answers over minutes. Buffering
    # collapses that into one late burst and the default 60s read timeout cuts it off entirely.
    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # gzip buffers to compress, which re-introduces exactly the delay proxy_buffering off removes
        gzip off;
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ainize.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ainize.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.ainize.ai) { return 301 https://$host$request_uri; } # managed by Certbot
    if ($host = ainize.ai)     { return 301 https://$host$request_uri; } # managed by Certbot
    server_name ainize.ai www.ainize.ai;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
